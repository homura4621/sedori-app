<style>

700}.cancel{background:#eee;color:#777}.empty{text-align:center;color:var(--muted);padding:50px 10px}.login{margin-top:90px;text-align:center;padding:28px}.login p{font-size:13px;color:var(--muted);line-height:1.7}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:25px;font-size:12px;opacity:0;transition:.2s;z-index:20}.toast.on{opacity:1}

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

/* Firebase画面に表示された実際の値へ置き換える */
const firebaseConfig={apiKey:"AIzaSyADwV67FPkNYbktQV-NrHUBEdIHlwo3WRc",authDomain:"kira-6971b.firebaseapp.com",projectId:"kira-6971b",storageBucket:"kira-6971b.firebasestorage.app",messagingSenderId:"780389951666",appId:"1:780389951666:web:0eded9c0a47b34f68841ab",measurementId:"G-BTP0WHY34L"};

const SEED_DATA={"lots":[],"sales":[]};
const DEFAULT_CHANNELS=[{name:"メルカリ",rate:.10},{name:"ヤフーフリマ",rate:.05},{name:"ヤフオク!",rate:.10},{name:"ラクマ",rate:.06},{name:"その他",rate:0}];
let auth,db,user,unsubscribe;let data={lots:[],sales:[],channels:JSON.parse(JSON.stringify(DEFAULT_CHANNELS))};let query="",filter="all",period={from:"",to:""},timer;
const $=s=>document.querySelector(s),yen=n=>"¥"+Math.round(+n||0).toLocaleString("ja-JP"),today=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"}),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>{let d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}function close(){$("#modal").innerHTML=""}function salesOf(id){return data.sales.filter(s=>s.lotId===id)}
function m(l){let ss=salesOf(l.id),sold=ss.reduce((a,s)=>a+s.qty,0),rev=ss.reduce((a,s)=>a+s.price*s.qty,0),out=ss.reduce((a,s)=>a+s.shipping+s.other+s.fee,0),cost=l.unit*l.qty+l.ship+l.exp,unit=l.qty?cost/l.qty:0,profit=rev-out-unit*sold;return{ss,sold,rev,out,cost,profit,remain:l.qty-sold,margin:rev?profit/rev:0}}
function inPeriod(d){return(!period.from||d>=period.from)&&(!period.to||d<=period.to)}
function total(){let rev=0,out=0,cost=0,count=0;data.sales.filter(s=>inPeriod(s.date)).forEach(s=>{let l=data.lots.find(x=>x.id===s.lotId);rev+=s.price*s.qty;out+=s.shipping+s.other+s.fee;count+=s.qty;if(l)cost+=(m(l).cost/l.qty)*s.qty});let inv=0,invVal=0;data.lots.forEach(l=>{let x=m(l);inv+=x.remain;invVal+=(x.cost/l.qty)*x.remain});let profit=rev-out-cost;return{rev,profit,margin:rev?profit/rev:0,count,inv,invVal}}
function save(){if(!user)return;clearTimeout(timer);timer=setTimeout(()=>setDoc(doc(db,"users",user.uid),{...data,updatedAt:serverTimestamp()},{merge:true}).catch(()=>toast("保存失敗")),250)}
function card(l){let x=m(l);return`<div class="card item"><div class="itemtop"><div><div class="name">${esc(l.name)}</div><div class="meta">${esc(l.supplier||"仕入先未入力")}・${l.date||""}</div></div><div class="right">残 ${x.remain}/${l.qty}<br><b class="${x.profit>=0?'profit':'loss'}">${yen(x.profit)}</b></div></div><button class="detail-toggle" data-toggle="${l.id}">商品の詳細を見る <span>▼</span></button><div class="detail" id="detail-${l.id}"><div class="mini"><div>仕入総額<b>${yen(x.cost)}</b></div><div>売上<b>${yen(x.rev)}</b></div><div>経費・手数料<b>${yen(x.out)}</b></div><div>利益率<b>${(x.margin*100).toFixed(1)}%</b></div></div><div class="sales">${x.ss.map(s=>`<div class="sale"><span>${s.date}・${esc(s.channel)}・${s.qty}個</span><span>${yen(s.price*s.qty)} <button data-delsale="${s.id}" style="border:0;background:none">✕</button></span></div>`).join("")}</div><div class="actions"><button data-sale="${l.id}">＋販売</button><button data-edit="${l.id}">編集</button><button data-del="${l.id}" style="color:var(--red)">削除</button></div></div></div>`}
function render(){if(!user){$("#app").innerHTML=`<div class="wrap"><div class="card login"><h1>せどり利益ノート</h1><p>GoogleログインでiPhone・PC・iPadのデータを同期します。</p><button class="btn dark" id="login">Googleでログイン</button></div></div>`;$("#login").onclick=login;return}let t=total(),lots=data.lots.filter(l=>{let x=m(l),q=(l.name+" "+(l.supplier||"")+" "+(l.memo||"")).toLowerCase().includes(query.toLowerCase());return q&&(filter==="all"||(filter==="stock"&&x.remain>0)||(filter==="sold"&&x.remain<=0))});$("#app").innerHTML=`<div class="wrap"><div class="top"><div><h1>せどり利益ノート</h1><div class="sub">${esc(user.email||"")}</div><div class="version">Ver.2.0</div></div><div class="top-actions"><button class="btn" id="logout">ログアウト</button></div></div><div class="main-actions" style="grid-template-columns:1fr 1fr"><button class="primary" id="add">＋ 仕入登録</button><button class="primary" id="quickSale">＋ 販売登録</button></div><div class="main-actions" style="grid-template-columns:1fr 1fr 1fr"><button id="importXlsx">⇪ データ読込</button><button id="exportData">⇩ データ保存</button><button id="templateXlsx">□ テンプレート</button></div><div class="main-actions" style="grid-template-columns:1fr 1fr"><button id="exportXlsx">📊 会計Excel作成</button><button id="feeSettings">⚙ 手数料設定</button></div><div class="summary"><div class="head"><b>全体集計</b><button class="period" id="period">${period.from||period.to?(period.from||"開始")+" ～ "+(period.to||"終了"):"全期間"} ▾</button></div><div class="grid"><div class="stat"><div class="label">売上</div><div class="value">${yen(t.rev)}</div></div><div class="stat"><div class="label">純利益</div><div class="value ${t.profit>=0?'profit':'loss'}">${yen(t.profit)}</div></div><div class="stat"><div class="label">利益率</div><div class="value">${(t.margin*100).toFixed(1)}%</div></div><div class="stat"><div class="label">販売数</div><div class="value">${t.count}個</div></div><div class="stat"><div class="label">在庫数</div><div class="value">${t.inv}個</div></div><div class="stat"><div class="label">在庫金額</div><div class="value">${yen(t.invVal)}</div></div></div></div><div class="tools"><input id="q" placeholder="商品名・仕入先・メモを検索" value="${esc(query)}"></div><div class="filter-tabs"><button data-filter="all" class="${filter==='all'?'active':''}">すべて</button><button data-filter="stock" class="${filter==='stock'?'active':''}">在庫あり</button><button data-filter="sold" class="${filter==='sold'?'active':''}">完売</button></div>${lots.length?lots.map(card).join(""):'<div class="empty">商品がありません</div>'}</div>`;$("#logout").onclick=()=>signOut(auth);$("#add").onclick=()=>lotForm();$("#quickSale").onclick=quickSaleForm;$("#importXlsx").onclick=importExcel;$("#exportData").onclick=exportDataExcel;$("#templateXlsx").onclick=exportTemplate;$("#exportXlsx").onclick=exportExcel;$("#feeSettings").onclick=channelSettings;$("#period").onclick=periodForm;$("#q").oninput=e=>{query=e.target.value;render()};document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let d=$("#detail-"+b.dataset.toggle),open=d.classList.toggle("open");b.firstChild.textContent=open?"商品の詳細を閉じる ":"商品の詳細を見る ";b.querySelector("span").textContent=open?"▲":"▼"});document.querySelectorAll("[data-sale]").forEach(b=>b.onclick=()=>saleForm(b.dataset.sale));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>lotForm(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delLot(b.dataset.del));document.querySelectorAll("[data-delsale]").forEach(b=>b.onclick=()=>delSale(b.dataset.delsale))}
function lotForm(id){let l=id?data.lots.find(x=>x.id===id):null;$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>${l?'仕入編集':'仕入登録'}</h2><div class="field"><label>商品名</label><input id="n" value="${esc(l?.name||'')}"></div><div class="field"><label>仕入先</label><input id="sup" value="${esc(l?.supplier||'')}"></div><div class="row"><div class="field"><label>仕入日</label><input id="d" type="date" value="${l?.date||today()}"></div><div class="field"><label>数量</label><input id="qty" type="number" min="1" value="${l?.qty||1}"></div></div><div class="row"><div class="field"><label>仕入単価</label><input id="unit" type="number" value="${l?.unit??''}"></div><div class="field"><label>仕入送料</label><input id="ship" type="number" value="${l?.ship||0}"></div></div><div class="field"><label>その他経費</label><input id="exp" type="number" value="${l?.exp||0}"></div><div class="field"><label>メモ</label><textarea id="memo">${esc(l?.memo||'')}</textarea></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">保存</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#ok").onclick=()=>{let name=$("#n").value.trim();if(!name)return toast("商品名を入力");let o={name,supplier:$("#sup").value.trim(),date:$("#d").value,qty:Math.max(1,+$("#qty").value||1),unit:+$("#unit").value||0,ship:+$("#ship").value||0,exp:+$("#exp").value||0,memo:$("#memo").value.trim()};if(l)Object.assign(l,o);else data.lots.unshift({id:uid("lot_"),...o});save();close();render();toast("保存しました")}}
function saleForm(id){let l=data.lots.find(x=>x.id===id),x=m(l);$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>${esc(l.name)}を販売登録</h2><div class="row"><div class="field"><label>販売日</label><input id="sd" type="date" value="${today()}"></div><div class="field"><label>販売先</label><select id="ch">${data.channels.map(c=>`<option>${esc(c.name)}</option>`).join("")}</select></div></div><div class="row"><div class="field"><label>販売単価</label><input id="price" type="number"></div><div class="field"><label>数量（残${x.remain}）</label><input id="sqty" type="number" min="1" max="${x.remain}" value="1"></div></div><div class="row"><div class="field"><label>送料</label><input id="sship" type="number" value="0"></div><div class="field"><label>その他経費</label><input id="other" type="number" value="0"></div></div><div class="field"><label>手数料（空欄なら自動）</label><input id="fee" type="number"></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">保存</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#ok").onclick=()=>{let price=+$("#price").value||0,qty=Math.max(1,+$("#sqty").value||1),ch=$("#ch").value;if(price<=0)return toast("販売価格を入力");if(qty>m(l).remain)return toast("在庫数を超えています");let rate=(data.channels.find(c=>c.name===ch)||{rate:0}).rate,fee=$("#fee").value;data.sales.push({id:uid("sale_"),lotId:id,date:$("#sd").value,channel:ch,price,qty,shipping:+$("#sship").value||0,other:+$("#other").value||0,fee:fee===""?Math.round(price*qty*rate):+fee||0});save();close();render();toast("販売登録しました")}}

function channelSettings(){
  let temp=JSON.parse(JSON.stringify(data.channels||DEFAULT_CHANNELS));
  function rows(){return temp.map((c,i)=>`<div class="channel-row"><input data-cname="${i}" value="${esc(c.name)}" placeholder="販売先名"><input data-crate="${i}" type="number" min="0" step="0.1" value="${(c.rate*100).toFixed(1)}" placeholder="手数料%"><button class="channel-del" data-cdel="${i}">×</button></div>`).join("")}
  function draw(){
    $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>販売先・手数料設定</h2><div class="label" style="margin-bottom:8px">手数料率は「10%」なら 10 と入力します。</div><div id="channelRows">${rows()}</div><button class="btn" id="addChannel" style="width:100%;margin-top:10px;border:1px dashed var(--line)">＋ 販売先を追加</button><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="saveChannels">保存する</button></div></div></div>`;
    $("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
    document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{read();temp.splice(+b.dataset.cdel,1);draw()});
    $("#addChannel").onclick=()=>{read();temp.push({name:"",rate:0});draw()};
    $("#saveChannels").onclick=()=>{read();temp=temp.filter(c=>c.name);if(!temp.length)return toast("販売先を1つ以上登録");data.channels=temp;save();close();render();toast("手数料設定を保存しました")};
  }
  function read(){
    temp=temp.map((c,i)=>({name:document.querySelector(`[data-cname="${i}"]`)?.value.trim()||"",rate:(+document.querySelector(`[data-crate="${i}"]`)?.value||0)/100}));
  }
  draw()
}

function periodForm(){let n=new Date(),y=n.getFullYear(),mo=String(n.getMonth()+1).padStart(2,"0"),ms=`${y}-${mo}-01`,me=new Date(y,n.getMonth()+1,0).toLocaleDateString("sv-SE"),ys=`${y}-01-01`,ye=`${y}-12-31`;$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>集計期間</h2><div class="actions"><button data-p="all">全期間</button><button data-from="${ms}" data-to="${me}">今月</button><button data-from="${ys}" data-to="${ye}">今年</button></div><div class="row"><div class="field"><label>開始日</label><input id="from" type="date" value="${period.from}"></div><div class="field"><label>終了日</label><input id="to" type="date" value="${period.to}"></div></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">適用</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("[data-p=all]").onclick=()=>{period={from:"",to:""};close();render()};document.querySelectorAll("[data-from]").forEach(b=>b.onclick=()=>{period={from:b.dataset.from,to:b.dataset.to};close();render()});$("#ok").onclick=()=>{period={from:$("#from").value,to:$("#to").value};close();render()}}

function loadXLSX(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve();let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function excelDate(v){if(!v)return"";if(v instanceof Date)return v.toLocaleDateString("sv-SE");if(typeof v==="number"){let d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10)}let m=String(v).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:String(v)}

function quickSaleForm(){
  const available=data.lots.filter(l=>m(l).remain>0);
  if(!available.length)return toast("販売できる在庫がありません");
  $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>販売する商品を選択</h2><div class="field"><label>商品</label><select id="saleLot">${available.map(l=>`<option value="${l.id}">${esc(l.name)}（残${m(l).remain}）</option>`).join("")}</select></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="next">次へ</button></div></div></div>`;
  $("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#next").onclick=()=>{const id=$("#saleLot").value;close();saleForm(id)};
}

  try{await loadXLSX();const wb=XLSX.utils.book_new();
    const shi=[["商品名","仕入先","仕入日","数量","仕入単価","仕入送料","その他経費","メモ"]];
    const han=[["商品名","販売日","販売先","販売数量","販売単価","販売手数料","発送・梱包費","その他経費"]];
    const ws1=XLSX.utils.aoa_to_sheet(shi),ws2=XLSX.utils.aoa_to_sheet(han);ws1["!cols"]=[{wch:30},{wch:20},{wch:12},{wch:9},{wch:13},{wch:13},{wch:13},{wch:30}];ws2["!cols"]=[{wch:30},{wch:12},{wch:16},{wch:10},{wch:13},{wch:14},{wch:14},{wch:13}];
    XLSX.utils.book_append_sheet(wb,ws1,"仕入");XLSX.utils.book_append_sheet(wb,ws2,"販売");XLSX.writeFile(wb,"せどり入力テンプレート.xlsx");toast("テンプレートを保存しました");
  }catch(e){console.error(e);toast("テンプレート作成に失敗しました")}
}
async function exportDataExcel(){
  try{await loadXLSX();const wb=XLSX.utils.book_new();
    const shi=[["商品名","仕入先","仕入日","数量","仕入単価","仕入送料","その他経費","メモ"]];
    data.lots.forEach(l=>shi.push([l.name,l.supplier||"",l.date||"",l.qty,l.unit,l.ship||0,l.exp||0,l.memo||""]));
    const han=[["商品名","販売日","販売先","販売数量","販売単価","販売手数料","発送・梱包費","その他経費"]];
    data.sales.forEach(s=>{const l=data.lots.find(x=>x.id===s.lotId);han.push([l?l.name:"",s.date||"",s.channel||"",s.qty,s.price,s.fee||0,s.shipping||0,s.other||0])});
    const ws1=XLSX.utils.aoa_to_sheet(shi),ws2=XLSX.utils.aoa_to_sheet(han);ws1["!cols"]=[{wch:30},{wch:20},{wch:12},{wch:9},{wch:13},{wch:13},{wch:13},{wch:30}];ws2["!cols"]=[{wch:30},{wch:12},{wch:16},{wch:10},{wch:13},{wch:14},{wch:14},{wch:13}];
    XLSX.utils.book_append_sheet(wb,ws1,"仕入");XLSX.utils.book_append_sheet(wb,ws2,"販売");XLSX.writeFile(wb,`せどりデータ_${today().replaceAll("-","")}.xlsx`);toast("データを保存しました");
  }catch(e){console.error(e);toast("データ保存に失敗しました")}
}

async function importExcel(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".xlsx,.xls";

  input.onchange=async()=>{
    const file=input.files[0];
    if(!file) return;

    try{
      await loadXLSX();
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
      const importedLots=[];
      const importedSales=[];
      const oldToNew={};
      const nameToLots={};

      const normalizeName=v=>String(v||"").trim().replace(/\s+/g," ").toLowerCase();
      const findSheet=(word)=>wb.SheetNames.find(n=>n.includes(word));
      const rowsOf=(sheetName)=>XLSX.utils.sheet_to_json(
        wb.Sheets[sheetName],
        {header:1,defval:"",raw:true}
      );
      const headerMap=(row)=>{
        const map={};
        row.forEach((v,i)=>map[String(v||"").trim()]=i);
        return map;
      };
      const value=(row,map,...names)=>{
        for(const name of names){
          if(map[name]!==undefined) return row[map[name]];
        }
        return "";
      };

      const purchaseSheet=findSheet("仕入");
      if(purchaseSheet){
        const rows=rowsOf(purchaseSheet);
        const headerIndex=rows.findIndex(r=>
          r.some(v=>String(v||"").trim()==="商品名")
        );

        if(headerIndex>=0){
          const h=headerMap(rows[headerIndex]);
          for(let i=headerIndex+1;i<rows.length;i++){
            const row=rows[i];
            const name=String(value(row,h,"商品名")||"").trim();
            if(!name || name==="合計") continue;

            const oldId=String(value(row,h,"仕入ID")||"").trim();
            const newId=uid("lot_");
            if(oldId) oldToNew[oldId]=newId;

            const lot={
              id:newId,
              name,
              supplier:String(value(row,h,"仕入先")||"").trim(),
              date:excelDate(value(row,h,"仕入日")),
              unit:+value(row,h,"仕入単価","仕入単価（1個）")||0,
              ship:+value(row,h,"仕入送料","仕入送料（合計）")||0,
              qty:Math.max(1,+value(row,h,"数量","仕入個数","仕入数量")||1),
              exp:+value(row,h,"仕入時経費","経費","その他経費")||0,
              memo:String(value(row,h,"メモ")||"").trim()
            };
            importedLots.push(lot);

            const key=normalizeName(name);
            if(!nameToLots[key]) nameToLots[key]=[];
            nameToLots[key].push(lot);
          }

          Object.values(nameToLots).forEach(arr=>{
            arr.sort((a,b)=>(a.date||"9999-99-99").localeCompare(b.date||"9999-99-99"));
          });
        }
      }

      const usedQty={};
      const salesSheet=wb.SheetNames.find(n=>n.includes("販売")&&!n.includes("販売先"));
      if(salesSheet){
        const rows=rowsOf(salesSheet);
        const headerIndex=rows.findIndex(r=>
          r.some(v=>["販売日","販売先","商品名"].includes(String(v||"").trim()))
        );

        if(headerIndex>=0){
          const h=headerMap(rows[headerIndex]);

          for(let i=headerIndex+1;i<rows.length;i++){
            const row=rows[i];
            const oldLotId=String(value(row,h,"仕入ID")||"").trim();
            const productName=String(value(row,h,"商品名")||"").trim();

            let lotId=oldLotId ? oldToNew[oldLotId] : "";

            if(!lotId && productName){
              const candidates=nameToLots[normalizeName(productName)]||[];
              const qtyNeeded=Math.max(1,+value(row,h,"販売数量","販売個数")||1);
              const match=candidates.find(l=>(l.qty-(usedQty[l.id]||0))>=qtyNeeded) || candidates[0];
              if(match) lotId=match.id;
            }

            if(!lotId) continue;

            const date=excelDate(value(row,h,"販売日"));
            const channel=String(value(row,h,"販売先")||"その他").trim()||"その他";
            const qty=Math.max(1,+value(row,h,"販売数量","販売個数")||1);

            let price=+value(row,h,"販売単価")||0;
            const revenue=+value(row,h,"売上高","売上合計")||0;
            if(price<=0 && revenue>0) price=revenue/qty;
            if(!date || price<=0) continue;

            let fee=+value(row,h,"販売手数料","手数料")||0;
            if(fee===0){
              const rate=(data.channels.find(c=>c.name===channel)||{rate:0}).rate;
              fee=Math.round(price*qty*rate);
            }

            importedSales.push({
              id:uid("sale_"),
              lotId,
              date,
              channel,
              price,
              qty,
              shipping:+value(row,h,"発送・梱包費","送料（自己負担）","送料")||0,
              fee,
              other:+value(row,h,"その他経費")||0
            });
            usedQty[lotId]=(usedQty[lotId]||0)+qty;
          }
        }
      }

      if(!importedLots.length && !importedSales.length){
        toast("読み込める仕入・販売データがありません");
        return;
      }

      const msg=`仕入 ${importedLots.length}件、販売 ${importedSales.length}件を追加しますか？`;
      if(confirm(msg)){
        data.lots=data.lots.concat(importedLots);
        data.sales=data.sales.concat(importedSales);
        save();
        render();
        toast(`仕入${importedLots.length}件・販売${importedSales.length}件を読み込みました`);
      }
    }catch(e){
      console.error(e);
      toast("Excel読込に失敗しました");
    }
  };

  input.click();
}

    data.lots.forEach(l=>{let x=m(l);shi.push([l.id,l.name,l.supplier||"",l.date||"",l.unit,l.ship,l.qty,x.cost,x.sold,x.remain,l.memo||""])});let ws1=XLSX.utils.aoa_to_sheet(shi);XLSX.utils.book_append_sheet(wb,ws1,"仕入");
    let han=[["販売実績"],[],["No","仕入ID","商品名","販売日","販売先","販売単価","販売個数","送料（自己負担）","売上合計","手数料","その他経費","利益"]];

}
