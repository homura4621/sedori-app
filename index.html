<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>せどり利益ノート</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--line:#e8e8e8;--muted:#909090;--text:#292929;--green:#2f8f5b;--red:#c24444}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:600px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:11px;padding:10px 13px}.dark{background:#292929;color:#fff}.round{width:38px;height:38px;border-radius:50%;font-size:20px}.card,.summary{background:var(--card);border-radius:16px;box-shadow:0 1px 4px #0000000d;margin-bottom:12px}.summary{padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.period{border:0;border-radius:20px;padding:7px 12px;background:#f0f0f1;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fafafa;border-radius:11px;padding:11px}.label{font-size:11px;color:var(--muted)}.value{text-align:right;font-size:19px;font-weight:700;margin-top:6px}.profit{color:var(--green)}.loss{color:var(--red)}.tools{display:flex;gap:8px;margin-bottom:12px}.tools input{flex:1}.tools input,.tools select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;width:100%}.item{padding:15px}.itemtop{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.meta{font-size:11px;color:var(--muted);margin-top:4px}.right{text-align:right;font-size:12px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.mini>div{background:#fafafa;padding:8px;border-radius:9px;font-size:11px;color:var(--muted)}.mini b{display:block;text-align:right;color:var(--text);margin-top:4px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;border:1px solid var(--line);background:#fafafa;border-radius:9px;padding:8px;font-size:12px}.sales{margin-top:10px}.sale{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;font-size:12px}.overlay{position:fixed;inset:0;background:#1117;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{font-size:17px;margin:0 0 14px}.field{margin-bottom:11px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sheetact{display:flex;gap:9px;margin-top:15px}.sheetact button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:700}.cancel{background:#eee;color:#777}.empty{text-align:center;color:var(--muted);padding:50px 10px}.login{margin-top:90px;text-align:center;padding:28px}.login p{font-size:13px;color:var(--muted);line-height:1.7}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:25px;font-size:12px;opacity:0;transition:.2s;z-index:20}.toast.on{opacity:1}
</style></head><body><div id="app"></div><div id="modal"></div><div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,onSnapshot,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* Firebase画面に表示された実際の値へ置き換える */
const firebaseConfig={apiKey:"AIzaSyADwV67FPkNYbktQV-NrHUBEdIHlwo3WRc",authDomain:"kira-6971b.firebaseapp.com",projectId:"kira-6971b",storageBucket:"kira-6971b.firebasestorage.app",messagingSenderId:"780389951666",appId:"1:780389951666:web:0eded9c0a47b34f68841ab",measurementId:"G-BTP0WHY34L"};

const channels=[{name:"メルカリ",rate:.10},{name:"ヤフーフリマ",rate:.05},{name:"ヤフオク!",rate:.10},{name:"ラクマ",rate:.06},{name:"その他",rate:0}];
let auth,db,user,unsubscribe;let data={lots:[],sales:[]};let query="",filter="all",period={from:"",to:""},timer;
const $=s=>document.querySelector(s),yen=n=>"¥"+Math.round(+n||0).toLocaleString("ja-JP"),today=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"}),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>{let d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}function close(){$("#modal").innerHTML=""}function salesOf(id){return data.sales.filter(s=>s.lotId===id)}
function m(l){let ss=salesOf(l.id),sold=ss.reduce((a,s)=>a+s.qty,0),rev=ss.reduce((a,s)=>a+s.price*s.qty,0),out=ss.reduce((a,s)=>a+s.shipping+s.other+s.fee,0),cost=l.unit*l.qty+l.ship+l.exp,unit=l.qty?cost/l.qty:0,profit=rev-out-unit*sold;return{ss,sold,rev,out,cost,profit,remain:l.qty-sold,margin:rev?profit/rev:0}}
function inPeriod(d){return(!period.from||d>=period.from)&&(!period.to||d<=period.to)}
function total(){let rev=0,out=0,cost=0,count=0;data.sales.filter(s=>inPeriod(s.date)).forEach(s=>{let l=data.lots.find(x=>x.id===s.lotId);rev+=s.price*s.qty;out+=s.shipping+s.other+s.fee;count+=s.qty;if(l)cost+=(m(l).cost/l.qty)*s.qty});let inv=0,invVal=0;data.lots.forEach(l=>{let x=m(l);inv+=x.remain;invVal+=(x.cost/l.qty)*x.remain});let profit=rev-out-cost;return{rev,profit,margin:rev?profit/rev:0,count,inv,invVal}}
function save(){if(!user)return;clearTimeout(timer);timer=setTimeout(()=>setDoc(doc(db,"users",user.uid),{...data,updatedAt:serverTimestamp()},{merge:true}).catch(()=>toast("保存失敗")),250)}
function card(l){let x=m(l);return`<div class="card item"><div class="itemtop"><div><div class="name">${esc(l.name)}</div><div class="meta">${esc(l.supplier||"仕入先未入力")}・${l.date||""}</div></div><div class="right">残 ${x.remain}/${l.qty}<br><b class="${x.profit>=0?'profit':'loss'}">${yen(x.profit)}</b></div></div><div class="mini"><div>仕入総額<b>${yen(x.cost)}</b></div><div>売上<b>${yen(x.rev)}</b></div><div>経費・手数料<b>${yen(x.out)}</b></div><div>利益率<b>${(x.margin*100).toFixed(1)}%</b></div></div><div class="sales">${x.ss.map(s=>`<div class="sale"><span>${s.date}・${esc(s.channel)}・${s.qty}個</span><span>${yen(s.price*s.qty)} <button data-delsale="${s.id}" style="border:0;background:none">✕</button></span></div>`).join("")}</div><div class="actions"><button data-sale="${l.id}">＋販売</button><button data-edit="${l.id}">編集</button><button data-del="${l.id}" style="color:var(--red)">削除</button></div></div>`}
function render(){if(!user){$("#app").innerHTML=`<div class="wrap"><div class="card login"><h1>せどり利益ノート</h1><p>GoogleログインでiPhone・PC・iPadのデータを同期します。</p><button class="btn dark" id="login">Googleでログイン</button></div></div>`;$("#login").onclick=login;return}let t=total(),lots=data.lots.filter(l=>{let x=m(l),q=(l.name+" "+(l.supplier||"")+" "+(l.memo||"")).toLowerCase().includes(query.toLowerCase());return q&&(filter==="all"||(filter==="stock"&&x.remain>0)||(filter==="sold"&&x.remain<=0))});$("#app").innerHTML=`<div class="wrap"><div class="top"><div><h1>せどり利益ノート</h1><div class="sub">${esc(user.email||"")}</div></div><div><button class="btn" id="logout">ログアウト</button> <button class="btn dark round" id="add">＋</button></div></div><div class="summary"><div class="head"><b>全体集計</b><button class="period" id="period">${period.from||period.to?(period.from||"開始")+" ～ "+(period.to||"終了"):"全期間"} ▾</button></div><div class="grid"><div class="stat"><div class="label">売上</div><div class="value">${yen(t.rev)}</div></div><div class="stat"><div class="label">純利益</div><div class="value ${t.profit>=0?'profit':'loss'}">${yen(t.profit)}</div></div><div class="stat"><div class="label">利益率</div><div class="value">${(t.margin*100).toFixed(1)}%</div></div><div class="stat"><div class="label">販売数</div><div class="value">${t.count}個</div></div><div class="stat"><div class="label">在庫数</div><div class="value">${t.inv}個</div></div><div class="stat"><div class="label">在庫金額</div><div class="value">${yen(t.invVal)}</div></div></div></div><div class="tools"><input id="q" placeholder="商品名・仕入先・メモを検索" value="${esc(query)}"><select id="f"><option value="all">すべて</option><option value="stock">在庫あり</option><option value="sold">完売</option></select></div>${lots.length?lots.map(card).join(""):'<div class="empty">商品がありません</div>'}</div>`;$("#f").value=filter;$("#logout").onclick=()=>signOut(auth);$("#add").onclick=()=>lotForm();$("#period").onclick=periodForm;$("#q").oninput=e=>{query=e.target.value;render()};$("#f").onchange=e=>{filter=e.target.value;render()};document.querySelectorAll("[data-sale]").forEach(b=>b.onclick=()=>saleForm(b.dataset.sale));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>lotForm(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delLot(b.dataset.del));document.querySelectorAll("[data-delsale]").forEach(b=>b.onclick=()=>delSale(b.dataset.delsale))}
function lotForm(id){let l=id?data.lots.find(x=>x.id===id):null;$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>${l?'仕入編集':'仕入登録'}</h2><div class="field"><label>商品名</label><input id="n" value="${esc(l?.name||'')}"></div><div class="field"><label>仕入先</label><input id="sup" value="${esc(l?.supplier||'')}"></div><div class="row"><div class="field"><label>仕入日</label><input id="d" type="date" value="${l?.date||today()}"></div><div class="field"><label>数量</label><input id="qty" type="number" min="1" value="${l?.qty||1}"></div></div><div class="row"><div class="field"><label>仕入単価</label><input id="unit" type="number" value="${l?.unit??''}"></div><div class="field"><label>仕入送料</label><input id="ship" type="number" value="${l?.ship||0}"></div></div><div class="field"><label>その他経費</label><input id="exp" type="number" value="${l?.exp||0}"></div><div class="field"><label>メモ</label><textarea id="memo">${esc(l?.memo||'')}</textarea></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">保存</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#ok").onclick=()=>{let name=$("#n").value.trim();if(!name)return toast("商品名を入力");let o={name,supplier:$("#sup").value.trim(),date:$("#d").value,qty:Math.max(1,+$("#qty").value||1),unit:+$("#unit").value||0,ship:+$("#ship").value||0,exp:+$("#exp").value||0,memo:$("#memo").value.trim()};if(l)Object.assign(l,o);else data.lots.unshift({id:uid("lot_"),...o});save();close();render();toast("保存しました")}}
function saleForm(id){let l=data.lots.find(x=>x.id===id),x=m(l);$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>${esc(l.name)}を販売登録</h2><div class="row"><div class="field"><label>販売日</label><input id="sd" type="date" value="${today()}"></div><div class="field"><label>販売先</label><select id="ch">${channels.map(c=>`<option>${c.name}</option>`).join("")}</select></div></div><div class="row"><div class="field"><label>販売単価</label><input id="price" type="number"></div><div class="field"><label>数量（残${x.remain}）</label><input id="sqty" type="number" min="1" max="${x.remain}" value="1"></div></div><div class="row"><div class="field"><label>送料</label><input id="sship" type="number" value="0"></div><div class="field"><label>その他経費</label><input id="other" type="number" value="0"></div></div><div class="field"><label>手数料（空欄なら自動）</label><input id="fee" type="number"></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">保存</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#ok").onclick=()=>{let price=+$("#price").value||0,qty=Math.max(1,+$("#sqty").value||1),ch=$("#ch").value;if(price<=0)return toast("販売価格を入力");if(qty>m(l).remain)return toast("在庫数を超えています");let rate=(channels.find(c=>c.name===ch)||{rate:0}).rate,fee=$("#fee").value;data.sales.push({id:uid("sale_"),lotId:id,date:$("#sd").value,channel:ch,price,qty,shipping:+$("#sship").value||0,other:+$("#other").value||0,fee:fee===""?Math.round(price*qty*rate):+fee||0});save();close();render();toast("販売登録しました")}}
function periodForm(){let n=new Date(),y=n.getFullYear(),mo=String(n.getMonth()+1).padStart(2,"0"),ms=`${y}-${mo}-01`,me=new Date(y,n.getMonth()+1,0).toLocaleDateString("sv-SE"),ys=`${y}-01-01`,ye=`${y}-12-31`;$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>集計期間</h2><div class="actions"><button data-p="all">全期間</button><button data-from="${ms}" data-to="${me}">今月</button><button data-from="${ys}" data-to="${ye}">今年</button></div><div class="row"><div class="field"><label>開始日</label><input id="from" type="date" value="${period.from}"></div><div class="field"><label>終了日</label><input id="to" type="date" value="${period.to}"></div></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">適用</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("[data-p=all]").onclick=()=>{period={from:"",to:""};close();render()};document.querySelectorAll("[data-from]").forEach(b=>b.onclick=()=>{period={from:b.dataset.from,to:b.dataset.to};close();render()});$("#ok").onclick=()=>{period={from:$("#from").value,to:$("#to").value};close();render()}}
function delLot(id){if(!confirm("仕入と販売履歴を削除しますか？"))return;data.lots=data.lots.filter(x=>x.id!==id);data.sales=data.sales.filter(x=>x.lotId!==id);save();render()}function delSale(id){if(!confirm("販売履歴を削除しますか？"))return;data.sales=data.sales.filter(x=>x.id!==id);save();render()}
async function login(){let p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")await signInWithRedirect(auth,p);else toast("ログイン失敗")}}
try{if(firebaseConfig.apiKey==="ここに貼り付け")throw Error();let app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);await getRedirectResult(auth).catch(()=>{});onAuthStateChanged(auth,u=>{user=u;if(unsubscribe)unsubscribe();if(u)unsubscribe=onSnapshot(doc(db,"users",u.uid),s=>{if(s.exists()){let d=s.data();data={lots:d.lots||[],sales:d.sales||[]}}else setDoc(doc(db,"users",u.uid),{...data,createdAt:serverTimestamp()});render()});else render()})}catch(e){$("#app").innerHTML='<div class="wrap"><div class="card login"><h1>Firebase設定を貼り付けてください</h1><p>HTML内の firebaseConfig を、Firebase画面に表示された実際のコードへ置き換えます。</p></div></div>'}
</script></body></html>
