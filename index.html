input[type="date"]{

function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}function close(){$("#modal").innerHTML=""}function salesOf(id){return data.sales.filter(s=>s.lotId===id)}
function m(l){let ss=salesOf(l.id),sold=ss.reduce((a,s)=>a+s.qty,0),rev=ss.reduce((a,s)=>a+s.price*s.qty,0),out=ss.reduce((a,s)=>a+s.shipping+s.other+s.fee,0),cost=l.unit*l.qty+l.ship+l.exp,unit=l.qty?cost/l.qty:0,profit=rev-out-unit*sold;return{ss,sold,rev,out,cost,profit,remain:l.qty-sold,margin:rev?profit/rev:0}}
function inPeriod(d){return(!period.from||d>=period.from)&&(!period.to||d<=period.to)}
function total(){let rev=0,out=0,cost=0,count=0;data.sales.filter(s=>inPeriod(s.date)).forEach(s=>{let l=data.lots.find(x=>x.id===s.lotId);rev+=s.price*s.qty;out+=s.shipping+s.other+s.fee;count+=s.qty;if(l)cost+=(m(l).cost/l.qty)*s.qty});let inv=0,invVal=0;data.lots.forEach(l=>{let x=m(l);inv+=x.remain;invVal+=(x.cost/l.qty)*x.remain});let profit=rev-out-cost;return{rev,profit,margin:rev?profit/rev:0,count,inv,invVal}}

function card(l){let x=m(l);return`<div class="card item"><div class="itemtop"><div><div class="name">${esc(l.name)}</div><div class="meta">${esc(l.supplier||"仕入先未入力")}・${l.date||""}</div></div><div class="right">残 ${x.remain}/${l.qty}<br><b class="${x.profit>=0?'profit':'loss'}">${yen(x.profit)}</b></div></div><button class="detail-toggle" data-toggle="${l.id}">商品の詳細を見る <span>▼</span></button><div class="detail" id="detail-${l.id}"><div class="mini"><div><span class="mini-label">仕入総額</span><span class="mini-num">${yen(x.cost)}</span></div><div><span class="mini-label">売上</span><span class="mini-num">${yen(x.rev)}</span></div><div><span class="mini-label">経費・手数料</span><span class="mini-num">${yen(x.out)}</span></div><div><span class="mini-label">利益率</span><span class="mini-num ${x.profit>=0?'profit':'loss'}">${(x.margin*100).toFixed(1)}%</span></div></div><div class="sales">${x.ss.map(s=>`<div class="sale"><span>${s.date}・${esc(s.channel)}・${s.qty}個</span><span>${yen(s.price*s.qty)}<span class="sale-actions"><button class="sale-edit" data-editsale="${s.id}">編集</button><button class="sale-delete" data-delsale="${s.id}">削除</button></span></span></div>`).join("")}</div><div class="actions"><button data-sale="${l.id}">＋販売</button><button data-edit="${l.id}">編集</button><button data-del="${l.id}" style="color:var(--red)">削除</button></div></div></div>`}
function render(){
  if(!user){
    $("#app").innerHTML=`<div class="wrap"><div class="card login"><h1>販売管理ノート</h1><p>Googleログインで、PC・スマホ・タブレットの収支データを同期します。</p><button class="btn dark" id="login">Googleでログイン</button></div></div>`;
    $("#login").onclick=login;
    return;
  }
  let t=total(),lots=data.lots.filter(l=>{let x=m(l),q=(l.name+" "+(l.supplier||"")+" "+(l.memo||"")).toLowerCase().includes(query.toLowerCase());return q&&(filter==="all"||(filter==="stock"&&x.remain>0)||(filter==="sold"&&x.remain<=0))});$("#app").innerHTML=`<div class="wrap"><div class="top"><div><h1>販売管理ノート</h1><div class="version">3.5</div></div><div class="top-actions"><button class="account-button" id="accountMenu" aria-label="Googleアカウント">${user.photoURL?`<img src="${esc(user.photoURL)}" alt="">`:`<span class="account-fallback">${esc((user.displayName||user.email||"G").slice(0,1).toUpperCase())}</span>`}</button></div></div><div class="quick-actions"><button id="add">＋ 仕入登録</button><button id="quickSale">＋ 販売登録</button></div><details class="more-menu"><summary>その他の操作<span class="chev">▾</span></summary><div class="more-menu-list"><button id="importXlsx">⇪&nbsp; データ読込</button><button id="exportData">⇩&nbsp; データ保存</button><button id="templateXlsx">▢&nbsp; テンプレート出力</button><button id="exportXlsx">▤&nbsp; 会計用Excel作成</button><button id="feeSettings">⚙&nbsp; 手数料設定</button></div></details><div class="danger-zone"><button class="danger-link" id="deleteAll">履歴をすべて削除</button></div><div class="summary"><div class="head"><b>全体集計</b><button class="period" id="period">${period.from||period.to?(period.from||"開始")+" ～ "+(period.to||"終了"):"全期間"} ▾</button></div><div class="grid"><div class="stat"><div class="label">売上</div><div class="value">${yen(t.rev)}</div></div><div class="stat"><div class="label">純利益</div><div class="value ${t.profit>=0?'profit':'loss'}">${yen(t.profit)}</div></div><div class="stat"><div class="label">利益率</div><div class="value">${(t.margin*100).toFixed(1)}%</div></div><div class="stat"><div class="label">販売数</div><div class="value">${t.count}個</div></div><div class="stat"><div class="label">在庫数</div><div class="value">${t.inv}個</div></div><div class="stat"><div class="label">在庫金額</div><div class="value">${yen(t.invVal)}</div></div></div></div><div class="tools"><input id="q" placeholder="商品名・仕入先・メモを検索" value="${esc(query)}"></div><div class="filter-tabs"><button data-filter="all" class="${filter==='all'?'active':''}">すべて</button><button data-filter="stock" class="${filter==='stock'?'active':''}">在庫あり</button><button data-filter="sold" class="${filter==='sold'?'active':''}">完売</button></div>${lots.length?lots.map(card).join(""):'<div class="empty">商品がありません</div>'}</div>`;$("#accountMenu").onclick=accountMenu;$("#add").onclick=()=>lotForm();$("#quickSale").onclick=quickSaleForm;$("#importXlsx").onclick=importExcel;$("#exportData").onclick=exportDataExcel;$("#templateXlsx").onclick=exportTemplate;$("#exportXlsx").onclick=exportExcel;$("#feeSettings").onclick=channelSettings;$("#deleteAll").onclick=deleteAllData;$("#period").onclick=periodForm;$("#q").oninput=e=>{query=e.target.value;render()};document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let d=$("#detail-"+b.dataset.toggle),open=d.classList.toggle("open");b.firstChild.textContent=open?"商品の詳細を閉じる ":"商品の詳細を見る ";b.querySelector("span").textContent=open?"▲":"▼"});document.querySelectorAll("[data-sale]").forEach(b=>b.onclick=()=>saleForm(b.dataset.sale));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>lotForm(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delLot(b.dataset.del));document.querySelectorAll("[data-editsale]").forEach(b=>b.onclick=()=>editSaleForm(b.dataset.editsale));document.querySelectorAll("[data-delsale]").forEach(b=>b.onclick=()=>delSale(b.dataset.delsale))}
function accountMenu(){

function lotForm(id){let l=id?data.lots.find(x=>x.id===id):null;$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>${l?'仕入編集':'仕入登録'}</h2>${l?'':`<p style="font-size:13px;color:var(--muted);margin:-5px 0 14px">同じ商品でも、仕入日または単価が違う場合は別に登録してください。</p>`}<div class="field"><label>商品名</label><input id="n" value="${esc(l?.name||'')}"></div><div class="field"><label>仕入先</label><input id="sup" value="${esc(l?.supplier||'')}"></div><div class="row"><div class="field"><label>仕入日</label><input id="d" type="date" value="${l?.date||today()}"></div><div class="field"><label>数量</label><input id="qty" type="number" min="1" value="${l?.qty||1}"></div></div><div class="row"><div class="field"><label>仕入単価</label><input id="unit" type="number" value="${l?.unit??''}"></div><div class="field"><label>仕入送料</label><input id="ship" type="number" value="${l?.ship||0}"></div></div><div class="field"><label>その他経費</label><input id="exp" type="number" value="${l?.exp||0}"></div><div class="field"><label>メモ</label><textarea id="memo">${esc(l?.memo||'')}</textarea></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">保存</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#ok").onclick=()=>{let name=$("#n").value.trim();if(!name)return toast("商品名を入力");let o={name,supplier:$("#sup").value.trim(),date:$("#d").value,qty:Math.max(1,+$("#qty").value||1),unit:+$("#unit").value||0,ship:+$("#ship").value||0,exp:+$("#exp").value||0,memo:$("#memo").value.trim()};if(l)Object.assign(l,o);else data.lots.unshift({id:uid("lot_"),...o});save();close();render();toast("保存しました")}}

function editSaleForm(saleId){
  const sale=data.sales.find(s=>s.id===saleId);
  if(!sale)return toast("販売データが見つかりません");
  const lot=data.lots.find(l=>l.id===sale.lotId);
  if(!lot)return toast("仕入データが見つかりません");

  const lotMetrics=m(lot);
  const maxQty=lotMetrics.remain+sale.qty;

  $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet">
    <h2>販売データを編集</h2>
    <div class="meta" style="margin:-6px 0 14px">${esc(lot.name)}・${lot.date||"仕入日なし"}仕入・変更可能数${maxQty}個</div>
    <div class="row">
      <div class="field"><label>販売日</label><input id="sd" type="date" value="${sale.date||today()}"></div>
      <div class="field"><label>販売先</label><select id="ch">${data.channels.map(c=>`<option ${c.name===sale.channel?'selected':''}>${esc(c.name)}</option>`).join("")}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>販売単価</label><input id="price" type="number" value="${sale.price||0}"></div>
      <div class="field"><label>数量（最大${maxQty}）</label><input id="sqty" type="number" min="1" max="${maxQty}" value="${sale.qty||1}"></div>
    </div>
    <div class="row">
      <div class="field"><label>送料</label><input id="sship" type="number" value="${sale.shipping||0}"></div>
      <div class="field"><label>その他経費</label><input id="other" type="number" value="${sale.other||0}"></div>
    </div>
    <div class="field"><label>手数料</label><input id="fee" type="number" value="${sale.fee||0}"></div>
    <div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">変更を保存</button></div>
  </div></div>`;

  $("#cancel").onclick=close;
  $("#ov").onclick=e=>{if(e.target.id==="ov")close()};
  $("#ok").onclick=()=>{
    const price=+$("#price").value||0;
    const qty=Math.max(1,+$("#sqty").value||1);
    if(price<=0)return toast("販売価格を入力してください");
    if(qty>maxQty)return toast("在庫数を超えています");

    Object.assign(sale,{
      date:$("#sd").value,
      channel:$("#ch").value,
      price,
      qty,
      shipping:+$("#sship").value||0,
      other:+$("#other").value||0,
      fee:+$("#fee").value||0
    });

    save();
    close();
    render();
    toast("販売データを更新しました");
  };
}

function saleForm(id){let l=data.lots.find(x=>x.id===id),x=m(l);$("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>${esc(l.name)}を販売登録</h2><div class="meta" style="margin:-6px 0 14px">${l.date||"仕入日なし"}仕入・残${x.remain}個・1個原価${yen(l.qty?x.cost/l.qty:0)}</div><div class="row"><div class="field"><label>販売日</label><input id="sd" type="date" value="${today()}"></div><div class="field"><label>販売先</label><select id="ch">${data.channels.map(c=>`<option>${esc(c.name)}</option>`).join("")}</select></div></div><div class="row"><div class="field"><label>販売単価</label><input id="price" type="number"></div><div class="field"><label>数量（残${x.remain}）</label><input id="sqty" type="number" min="1" max="${x.remain}" value="1"></div></div><div class="row"><div class="field"><label>送料</label><input id="sship" type="number" value="0"></div><div class="field"><label>その他経費</label><input id="other" type="number" value="0"></div></div><div class="field"><label>手数料（空欄なら自動）</label><input id="fee" type="number"></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="ok">保存</button></div></div></div>`;$("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};$("#ok").onclick=()=>{let price=+$("#price").value||0,qty=Math.max(1,+$("#sqty").value||1),ch=$("#ch").value;if(price<=0)return toast("販売価格を入力");if(qty>m(l).remain)return toast("在庫数を超えています");let rate=(data.channels.find(c=>c.name===ch)||{rate:0}).rate,fee=$("#fee").value;data.sales.push({id:uid("sale_"),lotId:id,date:$("#sd").value,channel:ch,price,qty,shipping:+$("#sship").value||0,other:+$("#other").value||0,fee:fee===""?Math.round(price*qty*rate):+fee||0});save();close();render();toast("販売登録しました")}}

function channelSettings(){
  let temp=JSON.parse(JSON.stringify(data.channels||DEFAULT_CHANNELS));
  function rows(){return temp.map((c,i)=>`<div class="channel-row"><input data-cname="${i}" value="${esc(c.name)}" placeholder="販売先名"><input data-crate="${i}" type="number" min="0" step="0.1" value="${(c.rate*100).toFixed(1)}" placeholder="手数料%"><button class="channel-del" data-cdel="${i}">×</button></div>`).join("")}
  function draw(){
    $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet"><h2>販売先・手数料設定</h2><div class="label" style="margin-bottom:8px">手数料率は「10%」なら 10 と入力します。</div><div id="channelRows">${rows()}</div><button class="btn" id="addChannel" style="width:100%;margin-top:10px;border:1px dashed var(--line)">＋ 販売先を追加</button><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="dark" id="saveChannels">保存する</button></div></div></div>`;
    $("#cancel").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
    document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{read();temp.splice(+b.dataset.cdel,1);draw()});
    $("#addChannel").onclick=()=>{read();temp.push({name:"",rate:0});draw()};
    $("#saveChannels").onclick=()=>{read();temp=temp.filter(c=>c.name);if(!temp.length)return toast("販売先を1つ以上登録");data.channels=temp;save();close();render();toast("手数料設定を保存しました")};
  }
  function read(){
    temp=temp.map((c,i)=>({name:document.querySelector(`[data-cname="${i}"]`)?.value.trim()||"",rate:(+document.querySelector(`[data-crate="${i}"]`)?.value||0)/100}));
  }
  draw()
}

function deleteAllData(){
  const count=data.lots.length+data.sales.length;
  if(!count)return toast("削除するデータがありません");
  $("#modal").innerHTML=`<div class="overlay centered" id="ov"><div class="sheet"><h2>せどり履歴をすべて削除</h2><p style="font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 14px">仕入データ、販売データ、在庫履歴をすべて削除します。手数料設定は残ります。この操作は元に戻せません。</p><div class="field"><label>確認のため「削除」と入力</label><input id="deleteConfirm" placeholder="削除"></div><div class="sheetact"><button class="cancel" id="cancel">キャンセル</button><button class="danger" id="deleteOk">すべて削除</button></div></div></div>`;

  $("#ov").onclick=e=>{if(e.target.id==="ov")close()};
  $("#deleteOk").onclick=async()=>{
    if($("#deleteConfirm").value.trim()!=="削除")return toast("「削除」と入力してください");
    data.lots=[];
    data.sales=[];
    period={from:"",to:""};
    query="";
    filter="all";
    try{
      await setDoc(doc(db,"users",user.uid),{
        lots:[],
        sales:[],
        channels:data.channels,
        resetVersion:"production-v3-2-zero",
        updatedAt:serverTimestamp()
      },{merge:true});
      close();render();toast("すべての履歴を削除しました");
    }catch(e){
      console.error(e);toast("削除に失敗しました");

}

function loadXLSX(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve();let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function excelDate(v){if(!v)return"";if(v instanceof Date)return v.toLocaleDateString("sv-SE");if(typeof v==="number"){let d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10)}let m=String(v).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:String(v)}

async function importExcel(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".xlsx,.xls";

  input.onchange=async()=>{
    const file=input.files[0];
    if(!file) return;

    try{
      await loadXLSX();
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
      const importedLots=[];
      const importedSales=[];
      const oldToNew={};
      const nameToLots={};

      const normalizeName=v=>String(v||"").trim().replace(/\s+/g," ").toLowerCase();
      const findSheet=(word)=>wb.SheetNames.find(n=>n.includes(word));
      const rowsOf=(sheetName)=>XLSX.utils.sheet_to_json(
        wb.Sheets[sheetName],
        {header:1,defval:"",raw:true}
      );
      const headerMap=(row)=>{
        const map={};
        row.forEach((v,i)=>map[String(v||"").trim()]=i);
        return map;
      };
      const value=(row,map,...names)=>{
        for(const name of names){
          if(map[name]!==undefined) return row[map[name]];
        }
        return "";
      };

      const purchaseSheet=findSheet("仕入");
      if(purchaseSheet){
        const rows=rowsOf(purchaseSheet);
        const headerIndex=rows.findIndex(r=>
          r.some(v=>String(v||"").trim()==="商品名")
        );

        if(headerIndex>=0){
          const h=headerMap(rows[headerIndex]);
          for(let i=headerIndex+1;i<rows.length;i++){
            const row=rows[i];
            const name=String(value(row,h,"商品名")||"").trim();
            if(!name || name==="合計") continue;

            const oldId=String(value(row,h,"仕入ID")||"").trim();
            const newId=uid("lot_");
            if(oldId) oldToNew[oldId]=newId;

            const lot={
              id:newId,
              name,
              supplier:String(value(row,h,"仕入先")||"").trim(),
              date:excelDate(value(row,h,"仕入日")),
              unit:+value(row,h,"仕入単価","仕入単価（1個）")||0,
              ship:+value(row,h,"仕入送料","仕入送料（合計）")||0,
              qty:Math.max(1,+value(row,h,"数量","仕入個数","仕入数量")||1),
              exp:+value(row,h,"仕入時経費","経費","その他経費")||0,
              memo:String(value(row,h,"メモ")||"").trim()
            };
            importedLots.push(lot);

            const key=normalizeName(name);
            if(!nameToLots[key]) nameToLots[key]=[];
            nameToLots[key].push(lot);
          }

          Object.values(nameToLots).forEach(arr=>{
            arr.sort((a,b)=>(a.date||"9999-99-99").localeCompare(b.date||"9999-99-99"));
          });
        }
      }

      const usedQty={};
      const salesSheet=wb.SheetNames.find(n=>n.includes("販売")&&!n.includes("販売先"));
      if(salesSheet){
        const rows=rowsOf(salesSheet);
        const headerIndex=rows.findIndex(r=>
          r.some(v=>["販売日","販売先","商品名"].includes(String(v||"").trim()))
        );

        if(headerIndex>=0){
          const h=headerMap(rows[headerIndex]);

          for(let i=headerIndex+1;i<rows.length;i++){
            const row=rows[i];
            const oldLotId=String(value(row,h,"仕入ID")||"").trim();
            const productName=String(value(row,h,"商品名")||"").trim();

            let lotId=oldLotId ? oldToNew[oldLotId] : "";

            if(!lotId && productName){
              const candidates=nameToLots[normalizeName(productName)]||[];
              const qtyNeeded=Math.max(1,+value(row,h,"販売数量","販売個数")||1);
              const match=candidates.find(l=>(l.qty-(usedQty[l.id]||0))>=qtyNeeded) || candidates[0];
              if(match) lotId=match.id;
            }

            if(!lotId) continue;

            const date=excelDate(value(row,h,"販売日"));
            const channel=String(value(row,h,"販売先")||"その他").trim()||"その他";
            const qty=Math.max(1,+value(row,h,"販売数量","販売個数")||1);

            let price=+value(row,h,"販売単価")||0;
            const revenue=+value(row,h,"売上高","売上合計")||0;
            if(price<=0 && revenue>0) price=revenue/qty;
            if(!date || price<=0) continue;

            let fee=+value(row,h,"販売手数料","手数料")||0;
            if(fee===0){
              const rate=(data.channels.find(c=>c.name===channel)||{rate:0}).rate;
              fee=Math.round(price*qty*rate);
            }

            importedSales.push({
              id:uid("sale_"),
              lotId,
              date,
              channel,
              price,
              qty,
              shipping:+value(row,h,"発送・梱包費","送料（自己負担）","送料")||0,
              fee,
              other:+value(row,h,"その他経費")||0
            });
            usedQty[lotId]=(usedQty[lotId]||0)+qty;
          }
        }
      }

      if(!importedLots.length && !importedSales.length){
        toast("読み込める仕入・販売データがありません");
        return;
      }

      const msg=`仕入 ${importedLots.length}件、販売 ${importedSales.length}件を追加しますか？`;
      if(confirm(msg)){
        data.lots=data.lots.concat(importedLots);
        data.sales=data.sales.concat(importedSales);
        save();
        render();
        toast(`仕入${importedLots.length}件・販売${importedSales.length}件を読み込みました`);
      }
    }catch(e){
      console.error(e);
      toast("Excel読込に失敗しました");
    }
  };

  input.click();
}

    await signInWithPopup(auth,provider);
  }catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){
      await signInWithRedirect(auth,provider);

    }

try{
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=getFirestore(app);
  await getRedirectResult(auth).catch(()=>{});

  onAuthStateChanged(auth,u=>{
    user=u;
    if(unsubscribe){
      unsubscribe();
      unsubscribe=null;
    }

    if(!u){
      data={lots:[],sales:[],channels:JSON.parse(JSON.stringify(DEFAULT_CHANNELS))};
      render();
      return;
    }

    unsubscribe=onSnapshot(doc(db,"users",u.uid),async snap=>{
      const RESET_VERSION="production-v3-2-zero";

      if(!snap.exists()||snap.data().resetVersion!==RESET_VERSION){
        data={
          lots:[],
          sales:[],
          channels:JSON.parse(JSON.stringify(DEFAULT_CHANNELS))
        };
        await setDoc(doc(db,"users",u.uid),{
          ...data,
          resetVersion:RESET_VERSION,
          initializedAt:serverTimestamp()
        });
        return;
      }

      const d=snap.data();
      data={
        lots:Array.isArray(d.lots)?d.lots:[],
        sales:Array.isArray(d.sales)?d.sales:[],
        channels:Array.isArray(d.channels)&&d.channels.length
          ?d.channels
          :JSON.parse(JSON.stringify(DEFAULT_CHANNELS))
      };
      render();
    },e=>{
      console.error(e);
      toast("データの読み込みに失敗しました");
    });
  });
}catch(e){
  console.error(e);
  $("#app").innerHTML='<div class="wrap"><div class="card login"><h1>Firebase接続エラー</h1><p>Firebase Authentication、Firestore、承認済みドメインの設定を確認してください。</p></div></div>';
}




let activeDateInput=null;
let calendarViewDate=new Date();

function dateToYmd(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseYmd(v){
  if(!v)return null;
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function openLargeCalendar(input){
  activeDateInput=input;
  const selected=parseYmd(input.value);
  calendarViewDate=selected||new Date();
  calendarViewDate=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth(),1);
  drawLargeCalendar();
}
function closeLargeCalendar(){
  document.querySelector("#calendarModal").innerHTML="";
  activeDateInput=null;
}
function selectLargeCalendarDate(d){
  if(!activeDateInput)return;
  activeDateInput.value=dateToYmd(d);
  activeDateInput.dispatchEvent(new Event("input",{bubbles:true}));
  activeDateInput.dispatchEvent(new Event("change",{bubbles:true}));
  closeLargeCalendar();
}
function drawLargeCalendar(){
  const y=calendarViewDate.getFullYear();
  const m=calendarViewDate.getMonth();
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const selected=parseYmd(activeDateInput?.value);
  const todayDate=new Date();
  const days=[];
  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const isOther=d.getMonth()!==m;
    const isToday=dateToYmd(d)===dateToYmd(todayDate);
    const isSelected=selected&&dateToYmd(d)===dateToYmd(selected);
    days.push(`<button type="button" class="calendar-day${isOther?' other':''}${isToday?' today':''}${isSelected?' selected':''}" data-caldate="${dateToYmd(d)}">${d.getDate()}</button>`);
  }

  const yearOptions=[];
  for(let yy=y-5;yy<=y+5;yy++){
    yearOptions.push(`<option value="${yy}" ${yy===y?'selected':''}>${yy}年</option>`);
  }
  const monthOptions=Array.from({length:12},(_,i)=>`<option value="${i}" ${i===m?'selected':''}>${i+1}月</option>`).join("");
  const selectedLabel=selected?`${selected.getFullYear()}年${selected.getMonth()+1}月${selected.getDate()}日を選択中`:"日付未選択";

  document.querySelector("#calendarModal").innerHTML=`
    <div class="calendar-overlay" id="calendarOverlay">
      <div class="calendar-card">
        <button type="button" class="calendar-close" id="calClose" aria-label="閉じる">×</button>
        <div class="calendar-head">
          <button type="button" class="calendar-nav" id="calPrev">‹</button>
          <div class="calendar-title">日付を選択</div>
          <button type="button" class="calendar-nav" id="calNext">›</button>
        </div>
        <div class="calendar-selects">
          <select id="calYear">${yearOptions.join("")}</select>
          <select id="calMonth">${monthOptions}</select>
        </div>
        <div class="calendar-selected-label">${selectedLabel}</div>
        <div class="calendar-week">
          <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
        </div>
        <div class="calendar-days">${days.join("")}</div>
        <div class="calendar-actions">
          <button type="button" class="calendar-cancel" id="calCancel">キャンセル</button>
          <button type="button" class="calendar-clear" id="calClear">クリア</button>
          <button type="button" class="calendar-today" id="calToday">今日</button>
        </div>
      </div>
    </div>`;

  document.querySelector("#calPrev").onclick=()=>{calendarViewDate=new Date(y,m-1,1);drawLargeCalendar()};
  document.querySelector("#calNext").onclick=()=>{calendarViewDate=new Date(y,m+1,1);drawLargeCalendar()};
  document.querySelector("#calCancel").onclick=closeLargeCalendar;
  document.querySelector("#calClose").onclick=closeLargeCalendar;
  document.querySelector("#calToday").onclick=()=>selectLargeCalendarDate(new Date());
  document.querySelector("#calClear").onclick=()=>{
    if(activeDateInput){
      activeDateInput.value="";
      activeDateInput.dispatchEvent(new Event("input",{bubbles:true}));
      activeDateInput.dispatchEvent(new Event("change",{bubbles:true}));
    }
    closeLargeCalendar();
  };
  document.querySelector("#calendarOverlay").onclick=e=>{if(e.target.id==="calendarOverlay")closeLargeCalendar()};
  document.querySelector("#calYear").onchange=e=>{
    calendarViewDate=new Date(+e.target.value,m,1);
    drawLargeCalendar();
  };
  document.querySelector("#calMonth").onchange=e=>{
    calendarViewDate=new Date(y,+e.target.value,1);
    drawLargeCalendar();
  };
  document.querySelectorAll("[data-caldate]").forEach(b=>b.onclick=()=>selectLargeCalendarDate(parseYmd(b.dataset.caldate)));
}
document.addEventListener("click",e=>{
  const input=e.target.closest('input[type="date"]');
  if(!input)return;
  e.preventDefault();
  input.blur();
  openLargeCalendar(input);
});
